services:
  frontend:
    build:
      context: ..
      dockerfile: apps/guest-web/Dockerfile
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
  hotel-frontend:
    build:
      context: ..
      dockerfile: apps/guest-web/Dockerfile
      args:
        WORKSPACE: apps/hotel-web
    ports: ["8081:80"]
    depends_on:
      api:
        condition: service_healthy
  admin-frontend:
    build:
      context: ..
      dockerfile: apps/guest-web/Dockerfile
      args:
        WORKSPACE: apps/admin-web
    ports: ["8082:80"]
    depends_on:
      api:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geobook
      POSTGRES_USER: geobook
      POSTGRES_PASSWORD: geobook
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "../services/api/sql:/docker-entrypoint-initdb.d"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geobook -d geobook"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MONGO_URL: mongodb://mongo:27017/geobook
      DATABASE_URL: postgres://geobook:geobook@postgres:5432/geobook
      KAFKA_BROKERS: kafka:29092
      SEED_DEMO: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SECURE_COOKIES: "false"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080/}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "GeoBook <no-reply@geobook.test>"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s
  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: postgres://geobook:geobook@postgres:5432/geobook
    restart: on-failure
volumes:
  mongo-data:
  postgres-data:
